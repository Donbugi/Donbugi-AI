name: Deploy AI Docker to EC2

on:
  push:
    branches:
      - main
      - feat/ai
  workflow_dispatch:

concurrency:
  group: deploy-ai-ec2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build -t finedu-ai:${{ github.sha }} -t finedu-ai:latest .
          docker save finedu-ai:${{ github.sha }} finedu-ai:latest | gzip > finedu-ai-image.tar.gz

      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_USER: ${{ secrets.EC2_USER }}
          AI_ANTHROPIC_API_KEY: ${{ secrets.AI_ANTHROPIC_API_KEY }}
          AI_ANTHROPIC_MODEL: ${{ secrets.AI_ANTHROPIC_MODEL }}
          AI_DB_HOST: ${{ secrets.AI_DB_HOST }}
          AI_DB_PORT: ${{ secrets.AI_DB_PORT }}
          AI_DB_NAME: ${{ secrets.AI_DB_NAME }}
          AI_DB_USER: ${{ secrets.AI_DB_USER }}
          AI_DB_PASSWORD: ${{ secrets.AI_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}" || { echo "::error::secret EC2_SSH_PRIVATE_KEY 가 비어 있습니다"; exit 1; }
          test -n "${HOST:-}" || { echo "::error::secret EC2_HOST 가 비어 있습니다"; exit 1; }
          test -n "${EC2_SSH_USER:-}" || { echo "::error::secret EC2_USER 가 비어 있습니다"; exit 1; }
          test -n "${AI_ANTHROPIC_API_KEY:-}" || { echo "::error::secret AI_ANTHROPIC_API_KEY 가 비어 있습니다"; exit 1; }
          test -n "${AI_DB_USER:-}" || { echo "::error::secret AI_DB_USER 가 비어 있습니다"; exit 1; }
          test -n "${AI_DB_PASSWORD:-}" || { echo "::error::secret AI_DB_PASSWORD 가 비어 있습니다"; exit 1; }

          DEPLOY_PATH="/opt/finedu-ai"
          ENV_PATH="${DEPLOY_PATH}/finedu-ai.env"
          CONTAINER_NAME="finedu-ai"
          NETWORK_NAME="finedu-net"

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/ec2_deploy
          chmod 600 ~/.ssh/ec2_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          python3 - << 'PY' > fined-ai.env
          import os
          import shlex

          values = {
              "APP_HOST": "0.0.0.0",
              "APP_PORT": "8000",
              "DB_HOST": os.getenv("AI_DB_HOST") or "host.docker.internal",
              "DB_PORT": os.getenv("AI_DB_PORT") or "5432",
              "DB_NAME": os.getenv("AI_DB_NAME") or "finedu",
              "DB_USER": os.getenv("AI_DB_USER") or "",
              "DB_PASSWORD": os.getenv("AI_DB_PASSWORD") or "",
              "ANTHROPIC_API_KEY": os.getenv("AI_ANTHROPIC_API_KEY") or "",
              "ANTHROPIC_MODEL": os.getenv("AI_ANTHROPIC_MODEL") or "claude-haiku-4-5",
          }
          for key, value in values.items():
              print(f"{key}={shlex.quote(value)}")
          PY

          scp -i ~/.ssh/ec2_deploy -o StrictHostKeyChecking=accept-new finedu-ai-image.tar.gz "${EC2_SSH_USER}@${HOST}:/tmp/finedu-ai-image.tar.gz"
          scp -i ~/.ssh/ec2_deploy -o StrictHostKeyChecking=accept-new fined-ai.env "${EC2_SSH_USER}@${HOST}:/tmp/finedu-ai.env"

          ssh -i ~/.ssh/ec2_deploy -o StrictHostKeyChecking=accept-new "${EC2_SSH_USER}@${HOST}" bash -s << EOF
            set -euo pipefail
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io
            fi
            sudo systemctl enable --now docker
            sudo mkdir -p "${DEPLOY_PATH}"
            sudo mv /tmp/finedu-ai.env "${ENV_PATH}"
            sudo chown root:root "${ENV_PATH}"
            sudo chmod 600 "${ENV_PATH}"
            sudo docker load -i /tmp/finedu-ai-image.tar.gz
            sudo docker network create "${NETWORK_NAME}" >/dev/null 2>&1 || true
            sudo docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
            sudo docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              --network "${NETWORK_NAME}" \
              --add-host host.docker.internal:host-gateway \
              --env-file "${ENV_PATH}" \
              -p 127.0.0.1:8000:8000 \
              finedu-ai:${{ github.sha }}
            for i in {1..30}; do
              if curl -fsS http://127.0.0.1:8000/health; then
                exit 0
              fi
              sleep 2
            done
            sudo docker logs --tail 200 "${CONTAINER_NAME}" || true
            exit 1
          EOF

          rm -f ~/.ssh/ec2_deploy fined-ai.env
